services:
  habit-db:
    image: postgres:16-alpine
    container_name: habit-db
    environment:
      POSTGRES_DB: habit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - habit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  habit-db-data:
