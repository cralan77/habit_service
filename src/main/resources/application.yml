spring:
  application:
    name: personal-habit-management
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5435/habit}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false

server:
  port: ${PORT:8083}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:cGVyc29uYWwtYXNzaXN0YW50LWF1dGgtc2VydmljZS1zZWNyZXQta2V5LTIwMjY=}

health:
  service:
    url: ${HEALTH_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.habit: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
